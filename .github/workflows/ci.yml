# Managed by repokeeper (https://github.com/vannt-dev/repokeeper). Edits are reported by `repokeeper check`. Keys and jobs you add yourself are left alone.

name: ci
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  commits:
    uses: vannt-dev/repokeeper/.github/workflows/commitlint.yml@ci/ubuntu-26-trial
  kotlin:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    uses: vannt-dev/repokeeper/.github/workflows/stack-java.yml@v0
    with:
      java-versions: '["17","21"]'
      os: '["ubuntu-26.04"]'
      build-tool: gradle
      gradle-version: current
      commands: '["gradle check"]'
  changes:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            printf '%s\n' "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Evq '^([^/]*\.md|docs/.*|LICENSE)$'; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
